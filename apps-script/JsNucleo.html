<script>
'use strict';
const STATUS = {
  concluida: { nome: 'Concluída', cor: 'v' }, iniciada: { nome: 'Iniciada', cor: 'a' },
  pendente: { nome: 'Pendente', cor: 'r' }, extra: { nome: 'Extra', cor: 'z' },
};
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtData = s => s ? s.split('-').reverse().slice(0, 2).join('/') : '';
const fmtDataCompleta = s => s.split('-').reverse().join('/');
const DIAS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const diaSem = s => DIAS[new Date(s + 'T00:00:00Z').getUTCDay()];

const Tok = {
  get() { try { return sessionStorage.getItem('pcm_tok') || ''; } catch (e) { return window.__tok || ''; } },
  set(t) { try { sessionStorage.setItem('pcm_tok', t); } catch (e) { window.__tok = t; } },
  clear() { try { sessionStorage.removeItem('pcm_tok'); } catch (e) { window.__tok = ''; } },
};

// Chamada ao servidor (Code.gs > rpc). Resolve com os dados ou rejeita com Error(mensagem).
function rpc(metodo, args) {
  return new Promise((ok, falha) => {
    google.script.run
      .withSuccessHandler(r => {
        if (r && r.ok) return ok(r.dados);
        if (r && r.auth) { Tok.clear(); pedirLogin(); }
        falha(new Error((r && r.erro) || 'Falha na resposta do servidor.'));
      })
      .withFailureHandler(e => falha(new Error((e && e.message) || 'Falha de comunicação com o servidor.')))
      .rpc(metodo, Object.assign({}, args || {}, { token: Tok.get() }));
  });
}
function toast(msg, erro) {
  const t = document.createElement('div');
  t.className = 'toast' + (erro ? ' erro' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), erro ? 5000 : 2500);
}
function modal(html) {
  const o = document.createElement('div');
  o.className = 'overlay'; o.innerHTML = '<div class="modal">' + html + '</div>';
  document.body.appendChild(o);
  o.fechar = () => o.remove();
  return o;
}
</script>
