<script>
'use strict';
const Cad = (() => {
let equipes = [], colabs = [];

async function carregar() {
  [equipes, colabs] = await Promise.all([rpc('gestao.equipes'), rpc('gestao.colaboradores')]);
  const opts = '<option value="">Sem equipe</option>' + equipes.map(e => `<option value="${e.id}">${esc(e.nome)}</option>`).join('');
  $('#co-eq').innerHTML = opts;
  $('#te').innerHTML = equipes.map(e => `<tr><td>${esc(e.nome)}</td><td>${colabs.filter(c => c.equipe_id === e.id && c.ativo).length} colaborador(es)</td>
    <td style="text-align:right"><button class="peq" data-ren="${e.id}">Renomear</button> <button class="peq perigo" data-dele="${e.id}">Excluir</button></td></tr>`).join('') || '<tr><td class="mut">Nenhuma equipe.</td></tr>';
  $('#tc').innerHTML = colabs.map(c => `<tr style="${c.ativo ? '' : 'opacity:.5'}"><td>${esc(c.nome)}${c.ativo ? '' : ' (inativo)'}</td>
    <td><select data-eq="${c.id}">${opts.replace(`value="${c.equipe_id}"`, `value="${c.equipe_id}" selected`)}</select></td>
    <td style="text-align:right">${c.ativo ? `<button class="peq perigo" data-inat="${c.id}">Inativar</button>` : `<button class="peq" data-ativ="${c.id}">Reativar</button>`}</td></tr>`).join('') || '<tr><td class="mut">Nenhum colaborador.</td></tr>';
  document.querySelectorAll('[data-ren]').forEach(b => b.onclick = async () => {
    const e = equipes.find(x => x.id === b.dataset.ren), nome = prompt('Novo nome da equipe:', e.nome);
    if (nome) acao(() => rpc('gestao.equipe.salvar', { id: e.id, nome }));
  });
  document.querySelectorAll('[data-dele]').forEach(b => b.onclick = () => confirm('Excluir equipe?') && acao(() => rpc('gestao.equipe.excluir', { id: b.dataset.dele })));
  document.querySelectorAll('[data-eq]').forEach(s => s.onchange = () => { const c = colabs.find(x => x.id === s.dataset.eq); acao(() => rpc('gestao.colaborador.salvar', { ...c, equipe_id: s.value })); });
  document.querySelectorAll('[data-inat]').forEach(b => b.onclick = () => confirm('Inativar colaborador? O histórico é mantido.') && acao(() => rpc('gestao.colaborador.inativar', { id: b.dataset.inat })));
  document.querySelectorAll('[data-ativ]').forEach(b => b.onclick = () => { const c = colabs.find(x => x.id === b.dataset.ativ); acao(() => rpc('gestao.colaborador.salvar', { ...c, ativo: true })); });
}
async function acao(fn) { try { await fn(); await carregar(); } catch (e) { toast(e.message, true); carregar(); } }

function mount() {
  $('#fe').onsubmit = e => { e.preventDefault(); acao(async () => { await rpc('gestao.equipe.salvar', { nome: $('#eq-nome').value }); $('#eq-nome').value = ''; }); };
  $('#fc').onsubmit = e => { e.preventDefault(); acao(async () => { await rpc('gestao.colaborador.salvar', { nome: $('#co-nome').value, equipe_id: $('#co-eq').value }); $('#co-nome').value = ''; }); };
  carregar();
}
  return { mount };
})();
</script>
