<script>
'use strict';
const Cal = (() => {
let cal = null, offset = 0;

async function carregar() {
  try { cal = await rpc('gestao.calendario', { offset }); } catch (e) { return toast(e.message, true); }
  desenhar();
}

function chip(a) {
  return `<div class="chip ${a.status}" draggable="true" data-id="${a.id}" title="${esc(a.descricao)}"><b>${esc(a.os || 'Sem OS')}</b>${esc(a.descricao)}</div>`;
}

function desenhar() {
  const filtro = $('#filtro').value;
  const colabs = cal.colaboradores.filter(c => !filtro || c.equipe_id === filtro).sort((a, b) => a.nome.localeCompare(b.nome));
  const eqNome = id => cal.equipes.find(e => e.id === id)?.nome || '';
  const linhas = [{ id: '', nome: 'Não alocadas', sub: 'backlog' }, ...colabs.map(c => ({ id: c.id, nome: c.nome, sub: eqNome(c.equipe_id) }))];
  const visiveis = new Set(colabs.map(c => c.id));

  $('#semanas').innerHTML = cal.semanas.map(s => `
    <section class="semana card"><h2>Semana ${s.numero} <span class="mut">· ${fmtData(s.dias[0])} a ${fmtData(s.dias[6])} de ${s.ano}</span></h2>
    <table class="cal"><tr><th class="nome">Colaborador</th>${s.dias.map(d => `<th class="${d === cal.hoje ? 'hoje' : ''}">${diaSem(d)} ${fmtData(d)}</th>`).join('')}</tr>
    ${linhas.map(l => `<tr><td class="nome">${esc(l.nome)}<div class="mut" style="font-weight:400">${esc(l.sub)}</div></td>
      ${s.dias.map(d => {
        const itens = cal.atividades.filter(a => a.data === d && a.colaborador_id === l.id && (l.id === '' || visiveis.has(l.id)));
        const fim = ['Sáb', 'Dom'].includes(diaSem(d));
        return `<td class="${fim ? 'fim' : ''} ${d === cal.hoje ? 'hoje' : ''}" data-d="${d}" data-c="${l.id}">${itens.map(chip).join('')}<button class="add" data-d="${d}" data-c="${l.id}" aria-label="Adicionar">+</button></td>`;
      }).join('')}</tr>`).join('')}
    </table></section>`).join('');
  ligar();
}

function ligar() {
  document.querySelectorAll('.add').forEach(b => b.onclick = () => editar({ data: b.dataset.d, colaborador_id: b.dataset.c }));
  document.querySelectorAll('.chip').forEach(c => {
    c.onclick = () => editar(cal.atividades.find(a => a.id === c.dataset.id));
    c.ondragstart = e => { e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed = 'copyMove'; };
  });
  document.querySelectorAll('td[data-d]').forEach(td => {
    td.ondragover = e => { e.preventDefault(); td.classList.add('sobre'); };
    td.ondragleave = () => td.classList.remove('sobre');
    td.ondrop = async e => {
      e.preventDefault(); td.classList.remove('sobre');
      const id = e.dataTransfer.getData('text/plain'); if (!id) return;
      const a = cal.atividades.find(x => x.id === id); if (!a) return;
      if (a.data === td.dataset.d && a.colaborador_id === td.dataset.c) return;
      const copiar = e.ctrlKey || e.altKey; // Ctrl/Alt + arrastar = duplicar
      try {
        await rpc(copiar ? 'gestao.atividade.duplicar' : 'gestao.atividade.salvar', { id, data: td.dataset.d, colaborador_id: td.dataset.c });
        toast(copiar ? 'Atividade duplicada' : 'Atividade remanejada'); carregar();
      } catch (err) { toast(err.message, true); }
    };
  });
}

function editar(a) {
  const nova = !a.id;
  const opts = ['<option value="">Não alocada</option>', ...cal.colaboradores.map(c => `<option value="${c.id}" ${c.id === a.colaborador_id ? 'selected' : ''}>${esc(c.nome)}</option>`)].join('');
  const o = modal(`<h2>${nova ? 'Nova atividade' : 'Editar atividade'}</h2>
    <label>Nº da OS</label><input id="f-os" maxlength="40" value="${esc(a.os || '')}">
    <label>Descrição *</label><textarea id="f-desc" maxlength="300">${esc(a.descricao || '')}</textarea>
    <div class="linha"><div><label>Data</label><input type="date" id="f-data" value="${a.data}"></div><div><label>Colaborador</label><select id="f-col">${opts}</select></div></div>
    ${!nova && a.status ? `<p class="mut">Último status apontado: <span class="tag ${a.status}">${STATUS[a.status].nome}</span></p>` : ''}
    <div class="acoes">${nova ? '' : '<button class="perigo" id="f-del">Excluir</button><button id="f-dup">Duplicar</button>'}<button id="f-x">Cancelar</button><button class="pri" id="f-ok">Salvar</button></div>`);
  const dados = () => ({ os: $('#f-os').value, descricao: $('#f-desc').value, data: $('#f-data').value, colaborador_id: $('#f-col').value });
  const rodar = async (fn, msg) => { try { await fn(); o.fechar(); toast(msg); carregar(); } catch (e) { toast(e.message, true); } };
  $('#f-x').onclick = o.fechar;
  $('#f-ok').onclick = () => rodar(() => rpc('gestao.atividade.salvar', nova ? dados() : { id: a.id, ...dados() }), 'Salvo');
  if (!nova) {
    $('#f-dup').onclick = () => rodar(() => rpc('gestao.atividade.duplicar', { id: a.id, ...dados() }), 'Atividade duplicada');
    $('#f-del').onclick = () => { if (confirm('Excluir esta atividade da programação?')) rodar(() => rpc('gestao.atividade.excluir', { id: a.id }), 'Excluída'); };
  }
  $('#f-desc').focus();
}

async function mount() {
  offset = 0;
  const eq = await rpc('gestao.equipes');
  $('#filtro').insertAdjacentHTML('beforeend', eq.map(e => `<option value="${e.id}">${esc(e.nome)}</option>`).join(''));
  $('#filtro').onchange = desenhar;
  $('#ant').onclick = () => { offset--; carregar(); };
  $('#prox').onclick = () => { offset++; carregar(); };
  $('#hoje').onclick = () => { offset = 0; carregar(); };
  carregar();
}
  return { mount };
})();
</script>
