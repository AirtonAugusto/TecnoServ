<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<title>Informe de Turno — AngloGold Ashanti</title>
<style>
:root {
  color-scheme: light;
  /* Identidade AngloGold Ashanti: Dourado #C4902E (Pantone 7510 C), Preto #000000 (Black 6 C) e Branco */
  --gold: #c4902e;
  --gold-2: #d9a84a;     /* dourado claro (realces sobre preto) */
  --pri: #0a0a0a;        /* preto */
  --pri-2: #2b2b2b;      /* preto hover */
  --acc: var(--gold);
  --acc-txt: #8a6114;    /* dourado escurecido p/ texto sobre fundo claro (contraste) */
  --acc-claro: #f9f2e3;
  --pri-t: #ffffff;
  --bg: #f4f2ee; --card: #ffffff; --txt: #1b1b1b; --mut: #6a665e; --brd: #e3dfd6;
  --verde: #2e9e4f; --amarelo: #dd9a00; --vermelho: #d93c3c; --azul: #2a6fdb;
  --r: 10px;
  --sombra: 0 1px 2px rgba(0,0,0,.05), 0 6px 18px rgba(0,0,0,.05);
  --sombra-2: 0 2px 4px rgba(0,0,0,.06), 0 12px 28px rgba(0,0,0,.12);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; -webkit-font-smoothing: antialiased; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; background: var(--bg); color: var(--txt); }
::selection { background: var(--gold); color: #000; }

/* ---------- Cabeçalho ---------- */
header.top { background: linear-gradient(180deg, #151515 0%, #0a0a0a 100%); color: #fff; padding: 10px 20px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; border-bottom: 3px solid var(--gold); box-shadow: 0 2px 12px rgba(0,0,0,.25); position: sticky; top: 0; z-index: 40; }
header.top h1 { margin: 0; font-size: .82rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--gold-2); }
header.top nav { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; justify-content: flex-end; }
header.top a { color: #d8d4ca; text-decoration: none; padding: 7px 14px; border-radius: 6px; font-weight: 500; font-size: .93rem; transition: background .15s, color .15s; }
header.top a:hover { background: rgba(196,144,46,.18); color: #fff; }
header.top a.on { background: var(--gold); color: #000; font-weight: 700; }
header.top button { background: transparent; color: var(--gold-2); border: 1px solid var(--gold); }
header.top button:hover { background: var(--gold); color: #000; }
main { max-width: 1200px; margin: 0 auto; padding: 22px 16px; }
main.estreito { max-width: 640px; padding: 16px 12px 22px; }

/* ---------- Componentes ---------- */
.card { background: var(--card); border: 1px solid var(--brd); border-radius: var(--r); padding: 18px; margin-bottom: 16px; box-shadow: var(--sombra); }
h2 { margin: 0 0 12px; font-size: 1.05rem; color: var(--pri); font-weight: 700; letter-spacing: .2px; padding-left: 10px; border-left: 4px solid var(--gold); line-height: 1.2; }
.modal h2, .escolha h2 { padding-left: 0; border-left: 0; }
h3 { margin: 12px 0 6px; font-size: 1rem; }
.mut { color: var(--mut); font-size: .9rem; }
label { display: block; font-weight: 600; margin: 12px 0 4px; font-size: .88rem; color: #3a372f; }
input, select, textarea, button { font: inherit; }
input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #d3cec1; border-radius: 8px; background: #fff; color: var(--txt); transition: border-color .15s, box-shadow .15s; }
textarea { min-height: 90px; resize: vertical; }
button, .btn { padding: 10px 18px; border-radius: 8px; border: 1px solid #cfc9bb; background: #fff; color: var(--txt); cursor: pointer; font-weight: 500; transition: background .15s, border-color .15s, color .15s, box-shadow .15s; }
button:hover { border-color: var(--gold); background: var(--acc-claro); }
button.pri { background: var(--pri); color: var(--pri-t); border-color: var(--pri); font-weight: 600; letter-spacing: .3px; }
button.pri:hover { background: var(--gold); border-color: var(--gold); color: #000; }
button:focus-visible, a:focus-visible, .cor:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(196,144,46,.25); }
button.perigo { color: var(--vermelho); border-color: var(--vermelho); background: #fff; }
button.perigo:hover { background: #fdeeee; border-color: var(--vermelho); }
button:disabled { opacity: .5; cursor: not-allowed; }
button.peq { padding: 5px 12px; font-size: .85rem; }
.linha { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
.linha > * { flex: 1 1 140px; }
.linha > .fixo { flex: 0 0 auto; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #0a0a0a; color: #fff; padding: 12px 20px; border-radius: 8px; border-left: 4px solid var(--gold); box-shadow: var(--sombra-2); z-index: 99; max-width: 92vw; }
.toast.erro { background: #8f1f1f; border-left-color: #ff8a8a; }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal { background: var(--card); border-radius: 12px; border-top: 4px solid var(--gold); padding: 22px; width: 100%; max-width: 460px; max-height: 92vh; overflow: auto; box-shadow: var(--sombra-2); }
.modal .acoes { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; flex-wrap: wrap; }
table { border-collapse: collapse; width: 100%; }
th, td { border-bottom: 1px solid var(--brd); padding: 10px 8px; text-align: left; font-size: .92rem; }
tbody tr:hover td, table:not(.cal) tr:hover td { background: #fbf8f1; }
th { color: var(--pri); font-size: .75rem !important; text-transform: uppercase; letter-spacing: .7px; border-bottom: 2px solid var(--gold) !important; font-weight: 700; }
.tag { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: .78rem; font-weight: 600; color: #fff; }
.tag.concluida { background: var(--verde); } .tag.iniciada { background: var(--amarelo); color: #222; }
.tag.pendente { background: var(--vermelho); } .tag.extra { background: var(--azul); }

/* ---------- Tela 1: apontamento ---------- */
.ativ { border: 1px solid var(--brd); border-radius: var(--r); padding: 14px; margin-bottom: 12px; background: var(--card); box-shadow: var(--sombra); }
.ativ .os { font-weight: 700; color: var(--acc-txt); letter-spacing: .3px; }
.ativ.ant { border-left: 5px solid var(--amarelo); }
.ativ .desc { margin: 4px 0 12px; }
.cores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cor { padding: 14px 4px; border-radius: 10px; border: 3px solid transparent; color: #fff; font-weight: 700; text-align: center; cursor: pointer; opacity: .45; user-select: none; transition: opacity .15s, transform .1s; }
.cor:hover { opacity: .75; }
.cor:active { transform: scale(.97); }
.cor.v { background: var(--verde); } .cor.a { background: var(--amarelo); color: #222; } .cor.r { background: var(--vermelho); } .cor.z { background: var(--azul); }
.cor.sel { opacity: 1; border-color: var(--pri); box-shadow: 0 0 0 2px var(--card) inset; }
.ativ.extra { border-left: 5px solid var(--azul); }
.fotos { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.fotos .foto { position: relative; }
.fotos img { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; border: 1px solid var(--brd); }
.fotos button { position: absolute; top: -6px; right: -6px; border-radius: 50%; padding: 0; width: 24px; height: 24px; }
.enviar { position: sticky; bottom: 0; background: linear-gradient(180deg, rgba(244,242,238,0) 0%, var(--bg) 35%); padding: 16px 0 10px; }
.enviar button { width: 100%; padding: 16px; font-size: 1.05rem; text-transform: uppercase; letter-spacing: 1.2px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
.legenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: .85rem; }
.legenda i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* ---------- Dashboard ---------- */
.kpis { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 16px; }
@media (min-width: 600px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1000px) { .kpis { grid-template-columns: 1.6fr 1fr 1fr 1fr; } }
.kpi { background: var(--card); border: 1px solid var(--brd); border-top: 3px solid var(--gold); border-radius: var(--r); padding: 18px 20px; box-shadow: var(--sombra); }
.kpi.hero { background: linear-gradient(135deg, #1c1608 0%, #0a0a0a 70%); border-color: #0a0a0a; border-top-color: var(--gold); }
.kpi.hero .rot, .kpi.hero .sub { color: #cfc8b6; }
.kpi.hero b { color: var(--gold-2); }
.kpi.hero .meter { background: rgba(255,255,255,.14); }
.kpi .rot { display: flex; align-items: center; gap: 8px; color: var(--mut); font-size: .76rem; text-transform: uppercase; letter-spacing: .8px; font-weight: 700; }
.kpi .rot i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.kpi b { display: block; font-size: 2.1rem; line-height: 1.15; margin: 6px 0 2px; color: var(--pri); font-weight: 700; letter-spacing: -.5px; }
.kpi.hero b { font-size: 3.4rem; line-height: 1.05; }
.kpi .sub { color: var(--mut); font-size: .85rem; }
.meter { height: 8px; border-radius: 4px; background: var(--acc-claro); margin: 10px 0 8px; overflow: hidden; }
.meter > div { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--gold) 0%, var(--gold-2) 100%); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
@media (min-width: 1000px) { .grid2 { grid-template-columns: 1fr 1.25fr; } }
.card .sub { margin: -6px 0 10px 14px; color: var(--mut); font-size: .85rem; }
.graf { position: relative; width: 100%; }
.pager-tab { margin-top: 2px; }
.rel-equipe { border: 1px solid var(--brd); border-left: 4px solid var(--gold); border-radius: var(--r); padding: 14px; margin-bottom: 14px; background: #fffdf9; }
.rel-colab { border-top: 1px dashed var(--brd); padding-top: 8px; margin-top: 8px; }
.rel-colab ul { margin: 4px 0; padding-left: 18px; }
.fotos-rel img { width: 110px; height: 110px; object-fit: cover; border-radius: 6px; margin: 2px; }

/* ---------- Calendário ---------- */
.semana { margin-bottom: 20px; overflow-x: auto; }
.semana h2 { position: sticky; left: 0; }
table.cal { min-width: 980px; table-layout: fixed; }
table.cal th { background: #faf8f3; text-align: center; border-bottom-width: 2px; }
table.cal th.hoje { background: var(--pri); color: var(--gold-2); }
table.cal th.nome, table.cal td.nome { width: 130px; text-align: left; font-weight: 600; position: sticky; left: 0; background: var(--card); z-index: 1; }
table.cal td { vertical-align: top; border: 1px solid var(--brd); min-height: 70px; height: 70px; padding: 4px; background: var(--card); }
table.cal tr:hover td { background: var(--card); }
table.cal td.fim { background: var(--bg); }
table.cal td.hoje { outline: 2px solid var(--acc); outline-offset: -2px; }
table.cal td.sobre { background: var(--acc-claro); }
.chip { font-size: .78rem; padding: 4px 6px; border-radius: 6px; background: #faf8f3; border: 1px solid var(--brd); border-left: 5px solid var(--brd); margin-bottom: 3px; cursor: grab; overflow: hidden; transition: box-shadow .15s; }
.chip:hover { box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.chip.concluida { border-left-color: var(--verde); } .chip.iniciada { border-left-color: var(--amarelo); }
.chip.pendente { border-left-color: var(--vermelho); } .chip.extra { border-left-color: var(--azul); }
.chip b { display: block; color: var(--acc-txt); }
.add { width: 100%; padding: 0; font-size: .8rem; opacity: .4; border: 1px dashed var(--brd); background: transparent; }
td:hover .add { opacity: 1; }
.nav-sem { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
@media print { header.top, .nav-sem, .no-print, .assinatura { display: none !important; } body { background: #fff; } .card, .kpi, .rel-equipe { box-shadow: none; } }

/* ---------- Marca / tela inicial ---------- */
a.marca { display: flex; align-items: center; background: transparent; border-radius: 6px; padding: 2px 0; }
a.marca img { height: 38px; width: auto; display: block; }
header.top a.marca:hover { background: transparent; }
.inicio { min-height: 100vh; display: flex; flex-direction: column; }
.inicio .hero { background: radial-gradient(ellipse at 50% 0%, #3a2c10 0%, #0a0a0a 68%); color: #fff; text-align: center; padding: 48px 16px 76px; border-bottom: 4px solid var(--gold); }
.inicio .hero img { width: min(300px, 70vw); height: auto; }
.inicio .hero h1 { margin: 14px 0 6px; font-size: 1.7rem; font-weight: 300; letter-spacing: 4px; text-transform: uppercase; }
.inicio .hero h1::after { content: ""; display: block; width: 56px; height: 3px; background: var(--gold); margin: 14px auto 0; border-radius: 2px; }
.inicio .hero p { margin: 14px 0 0; color: var(--gold-2); letter-spacing: 2px; text-transform: uppercase; font-size: .8rem; font-weight: 600; }
.escolhas { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; max-width: 780px; width: 100%; margin: -44px auto 28px; padding: 0 16px; }
.escolha { background: var(--card); border: 1px solid var(--brd); border-top: 4px solid var(--gold); border-radius: 12px; padding: 28px 22px; text-align: center; text-decoration: none; color: var(--txt); box-shadow: 0 8px 22px rgba(0,0,0,.16); transition: transform .15s, box-shadow .15s; }
.escolha:hover, .escolha:focus-visible { transform: translateY(-4px); box-shadow: 0 14px 30px rgba(0,0,0,.22); }
.escolha.adm { border-top-color: var(--pri); }
.escolha .go { transition: background .15s, color .15s; }
.escolha:hover .go { background: var(--gold); color: #000; }
.escolha .ico { width: 72px; height: 72px; margin: 0 auto; border-radius: 50%; background: #0a0a0a; display: flex; align-items: center; justify-content: center; }
.escolha .ico svg { width: 34px; height: 34px; }
.escolha h2 { margin: 14px 0 6px; font-size: 1.25rem; letter-spacing: 3px; font-weight: 700; }
.escolha p { margin: 0; color: var(--mut); font-size: .95rem; }
.escolha .go { display: inline-block; margin-top: 16px; padding: 9px 26px; border-radius: 8px; background: var(--pri); color: #fff; font-weight: 600; letter-spacing: .5px; }
.inicio footer { margin-top: auto; text-align: center; color: var(--mut); font-size: .85rem; padding: 18px 14px; }
.inicio footer .dica { font-size: .78rem; opacity: .85; }
#barra-carregando { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--gold); z-index: 200; opacity: 0; transition: opacity .2s; }
#barra-carregando.ativa { opacity: 1; width: 70%; transition: width 6s cubic-bezier(.1,.8,.2,1), opacity .2s; }

/* ---------- Assinatura ---------- */
.assinatura { text-align: center; font-size: .78rem; color: var(--mut); padding: 18px 12px 22px; letter-spacing: .3px; }
.assinatura::before { content: ""; display: block; width: 40px; height: 2px; background: var(--gold); margin: 0 auto 10px; border-radius: 2px; }
.assinatura b { color: var(--acc-txt); font-weight: 600; }
.inicio .assinatura { background: #0a0a0a; color: #a9a396; border-top: 3px solid var(--gold); padding: 18px 12px 22px; }
.inicio .assinatura b { color: var(--gold-2); }
.inicio .assinatura::before { display: none; }
</style>

// Carregamento antecipado: enquanto a pessoa lê a tela inicial, o servidor já "acorda" e traz nomes e tarefas.
let PRE = null;

// Barra de carregamento (feedback enquanto o servidor responde)
let pendentes = 0;
function carregando(delta) {
  pendentes = Math.max(0, pendentes + delta);
  let b = document.getElementById('barra-carregando');
  if (!b) { b = document.createElement('div'); b.id = 'barra-carregando'; document.body.appendChild(b); }
  b.className = pendentes ? 'ativa' : '';
}

function tratarResposta(r, ok, falha) {
  if (r && r.ok) return ok(r.dados);
  if (r && r.auth) { Tok.clear(); pedirLogin(); }
  falha(new Error((r && r.erro) || 'Falha na resposta do servidor.'));
}

// Chamada ao servidor (Code.gs > rpc). Resolve com os dados ou rejeita com Error(mensagem).
function rpc(metodo, args) {
  const params = Object.assign({}, args || {}, { token: Tok.get() });
  carregando(1);
  const fim = f => v => { carregando(-1); f(v); };
  return new Promise((ok, falha) => {
    if (NO_GOOGLE) {
      google.script.run
        .withSuccessHandler(r => tratarResposta(r, fim(ok), fim(falha)))
        .withFailureHandler(e => fim(falha)(new Error((e && e.message) || 'Falha de comunicação com o servidor.')))
        .rpc(metodo, params);
    } else {
      // text/plain evita o "preflight" de CORS; o Apps Script responde JSON.
      fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ metodo: metodo, args: params }), redirect: 'follow' })
        .then(r => r.json())
        .then(r => tratarResposta(r, fim(ok), fim(falha)))
        .catch(() => fim(falha)(new Error('Não foi possível falar com o servidor. Verifique a internet e tente de novo.')));
    }
  });
}
function toast(msg, erro) {
  const t = document.createElement('div');
  t.className = 'toast' + (erro ? ' erro' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), erro ? 5000 : 2500);
}
function modal(html) {
  const o = document.createElement('div');
  o.className = 'overlay'; o.innerHTML = '<div class="modal">' + html + '</div>';
  document.body.appendChild(o);
  o.fechar = () => o.remove();
  return o;
}

let estado = null; // { dados, marcas:{atividadeId:status}, extras:[], fotos:[] }
const chave = 'pcm_colaborador';

async function iniciar() {
  const sel = $('#colab'), salvo = ls.get(chave) || '';
  const montarLista = lista => {
    const atual = sel.value || salvo;
    sel.innerHTML = '<option value="">Selecione seu nome…</option>' + lista.map(c => `<option value="${c.id}">${esc(c.nome)}${c.equipe ? ' — ' + esc(c.equipe) : ''}</option>`).join('');
    sel.value = atual;
  };
  const guardada = ls.getJSON('pcm_colabs');
  if (guardada) montarLista(guardada); // aparece na hora; a lista nova chega logo em seguida
  sel.onchange = () => { ls.set(chave, sel.value); carregar(); };
  $('#data').onchange = carregar;
  let r = PRE ? await PRE : null; PRE = null;
  if (!r) r = await rpc('publico.inicio', { id: salvo });
  ls.setJSON('pcm_colabs', r.colaboradores);
  montarLista(r.colaboradores);
  carregar(true, sel.value === salvo ? r.tarefas : null);
}

async function carregar(primeira, pre) {
  const id = $('#colab').value;
  if (!id) { $('#conteudo').innerHTML = '<p class="mut">Escolha seu nome para ver as atividades do dia.</p>'; return; }
  try {
    const d = pre || await rpc('publico.tarefas', { id, data: $('#data').value || '' });
    if (!$('#data').options.length || primeira) {
      $('#data').innerHTML = [0, 1, 2].map(n => { const v = addDias(d.hoje, -n); return `<option value="${v}">${n === 0 ? 'Hoje' : n === 1 ? 'Ontem' : 'Anteontem'} — ${fmtDataCompleta(v)}</option>`; }).join('');
      $('#data').value = d.data;
    }
    estado = { dados: d, marcas: {}, extras: d.extras.map(e => ({ ...e })), fotos: [] };
    for (const a of [...d.atividades, ...d.anteriores]) if (a.status) estado.marcas[a.id] = a.status;
    desenhar();
  } catch (e) { toast(e.message, true); $('#conteudo').innerHTML = ''; }
}
function addDias(s, n) { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }

function cardAtiv(a, ant) {
  const m = estado.marcas[a.id] || '';
  const caixa = (st, cor, txt) => `<div class="cor ${cor} ${m === st ? 'sel' : ''}" data-id="${a.id}" data-st="${st}" role="button" tabindex="0">${txt}</div>`;
  return `<div class="ativ ${ant ? 'ant' : ''}">
    <div><span class="os">${esc(a.os || 'Sem OS')}</span>${ant ? ` <span class="mut">· programada ${fmtData(a.data)}${a.ultimo_status ? ' · última: ' + STATUS[a.ultimo_status].nome : ' · sem apontamento'}</span>` : ''}</div>
    <div class="desc">${esc(a.descricao)}</div>
    <div class="cores">${caixa('concluida', 'v', '✔ Concluída')}${caixa('iniciada', 'a', '◐ Iniciada')}${caixa('pendente', 'r', '✖ Pendente')}</div>
  </div>`;
}

function desenhar() {
  const { dados: d } = estado;
  let h = `<div class="card legenda"><span><i style="background:var(--verde)"></i>Concluída</span><span><i style="background:var(--amarelo)"></i>Iniciada, não concluída</span><span><i style="background:var(--vermelho)"></i>Pendente</span><span><i style="background:var(--azul)"></i>Extra</span></div>`;
  if (d.enviado_em) h += `<div class="card" style="border-color:var(--verde)">✔ Você já enviou este turno. Pode ajustar e reenviar — o novo envio substitui o anterior.</div>`;
  h += `<h2>Atividades de ${d.data === d.hoje ? 'hoje' : fmtDataCompleta(d.data)}</h2>`;
  h += d.atividades.length ? d.atividades.map(a => cardAtiv(a, false)).join('') : '<p class="mut">Nenhuma atividade programada para este dia.</p>';
  if (d.anteriores.length) h += `<h2>Continuidade (dias anteriores)</h2>` + d.anteriores.map(a => cardAtiv(a, true)).join('');

  h += `<h2>Atividades extras</h2><div id="extras">${estado.extras.map((x, i) => `
    <div class="ativ extra">
      <div class="linha"><div><label>OS (opcional)</label><input data-x="${i}" data-k="os" value="${esc(x.os)}"></div>
      <div><label>Classificação *</label><select data-x="${i}" data-k="classificacao"><option value="">Selecione…</option>${['BPF', 'Corretiva'].map(o => `<option ${x.classificacao === o ? 'selected' : ''}>${o}</option>`).join('')}</select></div></div>
      <label>Descrição *</label><input data-x="${i}" data-k="descricao" value="${esc(x.descricao)}">
      <div class="cores" style="margin-top:8px;grid-template-columns:1fr auto"><div class="cor z sel">● Extra</div><button data-rm="${i}">Remover</button></div>
    </div>`).join('')}</div>
    <button id="addx" style="width:100%;margin-bottom:14px">+ Adicionar atividade extra</button>`;

  h += `<div class="card"><label for="obs">Observações / relatório do turno</label><textarea id="obs" maxlength="2000" placeholder="Ocorrências, pendências, materiais, recados…">${esc(d.observacao)}</textarea>
    <label>Fotos do dia${d.fotos ? ` <span class="mut">(${d.fotos} já enviada(s))</span>` : ''}</label>
    <input type="file" id="arq" accept="image/*" multiple>
    <div class="fotos" id="fotos"></div></div>
    <div class="enviar"><button class="pri" id="enviar">Enviar relatório do turno</button></div>`;
  $('#conteudo').innerHTML = h;
  desenharFotos();
  ligarEventos();
}

function ligarEventos() {
  const c = $('#conteudo');
  c.querySelectorAll('.cor[data-id]').forEach(el => {
    const alt = () => { const { id, st } = el.dataset; if (estado.marcas[id] === st) delete estado.marcas[id]; else estado.marcas[id] = st; salvarCampos(); desenhar(); };
    el.onclick = alt; el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); alt(); } };
  });
  c.querySelectorAll('[data-x]').forEach(el => el.oninput = el.onchange = () => { estado.extras[el.dataset.x][el.dataset.k] = el.value; });
  c.querySelectorAll('[data-rm]').forEach(el => el.onclick = () => { salvarCampos(); estado.extras.splice(el.dataset.rm, 1); desenhar(); });
  $('#addx').onclick = () => { salvarCampos(); estado.extras.push({ os: '', descricao: '', classificacao: '' }); desenhar(); };
  $('#arq').onchange = async e => {
    for (const f of e.target.files) {
      if (estado.fotos.length >= 8) { toast('Máximo de 8 fotos por envio.', true); break; }
      try { estado.fotos.push(await reduzir(f)); } catch { toast('Não foi possível ler a foto ' + f.name, true); }
    }
    e.target.value = ''; desenharFotos();
  };
  $('#enviar').onclick = enviar;
}
function salvarCampos() { estado.dados.observacao = $('#obs')?.value ?? estado.dados.observacao; }

function desenharFotos() {
  $('#fotos').innerHTML = estado.fotos.map((f, i) => `<div class="foto"><img src="${f}" alt="foto ${i + 1}"><button data-f="${i}" aria-label="Remover foto">×</button></div>`).join('');
  $('#fotos').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { salvarCampos(); estado.fotos.splice(b.dataset.f, 1); desenharFotos(); });
}

// Reduz a foto no navegador (máx. 1280px, JPEG) para o envio ser rápido no celular.
function reduzir(file) {
  return new Promise((ok, falha) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const esc = Math.min(1, 1280 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * esc); cv.height = Math.round(img.height * esc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url); ok(cv.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); falha(); };
    img.src = url;
  });
}

async function enviar() {
  salvarCampos();
  const d = estado.dados;
  for (const [i, x] of estado.extras.entries()) {
    if (!x.classificacao) return toast(`Atividade extra ${i + 1}: escolha BPF ou Corretiva.`, true);
    if (!x.descricao.trim()) return toast(`Atividade extra ${i + 1}: descreva a atividade.`, true);
  }
  const todas = [...d.atividades, ...d.anteriores];
  const semMarca = d.atividades.filter(a => !estado.marcas[a.id]).length;
  if (semMarca && !confirm(`${semMarca} atividade(s) de hoje sem status serão registradas como NÃO APONTADAS. Enviar mesmo assim?`)) return;
  const btn = $('#enviar'); btn.disabled = true; btn.textContent = 'Enviando…';
  try {
    await rpc('publico.enviar', {
      colaborador_id: d.colaborador.id, data: d.data, observacao: d.observacao,
      itens: todas.filter(a => estado.marcas[a.id]).map(a => ({ atividade_id: a.id, status: estado.marcas[a.id] })),
      extras: estado.extras, fotos: estado.fotos,
    });
    toast('Relatório enviado com sucesso!');
    carregar();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) { toast(e.message, true); btn.disabled = false; btn.textContent = 'Enviar relatório do turno'; }
}

  const nc = l => l.pendentes + l.sem_apontamento;
  const serie = (label, campo, cor) => ({ label, data: linhas.map(l => l[campo]), backgroundColor: cor, borderColor: SUPERFICIE, borderWidth: 2, borderRadius: 4, borderSkipped: false, maxBarThickness: 22, categoryPercentage: 0.72, barPercentage: 1 });
  const contagem = { 'Concluídas': l => l.concluidas, 'Iniciadas': l => l.iniciadas, 'Não conformidade': nc };
  return {
    type: 'bar',
    data: { labels: linhas.map(l => l.nome), datasets: [serie('Concluídas', 'pct_aderencia', COR.verde), serie('Iniciadas', 'pct_iniciadas', COR.amarelo), serie('Não conformidade', 'pct_nao_conformidade', COR.vermelho)] },
    options: {
      indexAxis: 'y', layout: { padding: { right: 68 } },
      interaction: { mode: 'nearest', axis: 'y', intersect: true },
      scales: {
        x: { stacked: true, min: 0, max: 100, grid: { color: GRADE, lineWidth: 1 }, border: { display: false }, ticks: { callback: v => v + '%', stepSize: 25 } },
        y: { stacked: true, grid: { display: false }, border: { display: false }, ticks: { color: TINTA, font: { size: 13 } } },
      },
      plugins: {
        legend: { position: 'top', align: 'start', labels: { usePointStyle: true, pointStyle: 'rectRounded', boxWidth: 10, boxHeight: 10, padding: 18, color: MUDO } },
        tooltip: {
          ...tooltipBase,
          callbacks: {
            title: it => linhas[it[0].dataIndex].nome,
            label: c => { const l = linhas[c.dataIndex]; return ` ${c.dataset.label}: ${pc(c.parsed.x)} (${contagem[c.dataset.label](l)} atividades)`; },
            afterLabel: c => { const l = linhas[c.dataIndex]; return c.dataset.label === 'Não conformidade' ? `   ${l.pendentes} pendentes · ${l.sem_apontamento} sem apontamento` : ''; },
            footer: it => `${linhas[it[0].dataIndex].planejadas} atividades planejadas`,
          },
        },
      },
    },
    plugins: [rotuloFim(linhas)],
  };
}

function ajustarAltura(id, n, porLinha, min = 150) { $('#' + id).style.height = Math.max(min, 76 + n * porLinha) + 'px'; }

// Linha vertical fina que acompanha o ponteiro no gráfico de evolução.
const mira = { id: 'mira', afterDatasetsDraw(chart) {
  const a = chart.tooltip?._active?.[0]; if (!a) return;
  const { ctx, chartArea } = chart; ctx.save(); ctx.strokeStyle = '#cfc9bb'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(a.element.x, chartArea.top); ctx.lineTo(a.element.x, chartArea.bottom); ctx.stroke(); ctx.restore();
} };

function linha(serie) {
  const dados = serie.map(d => d.planejadas ? d.pct_aderencia : null);
  const ultimo = dados.reduce((u, v, i) => v === null ? u : i, -1);
  return {
    type: 'line',
    data: { labels: serie.map(d => diaSem(d.data) + ' ' + fmtData(d.data)), datasets: [{
      label: 'Aderência', data: dados, borderColor: COR.ouro, borderWidth: 2, backgroundColor: 'rgba(196,144,46,.12)', fill: true, tension: 0.25, spanGaps: true,
      pointRadius: dados.map((_, i) => i === ultimo ? 5 : 0), pointHoverRadius: 6, pointBackgroundColor: COR.ouro, pointBorderColor: SUPERFICIE, pointBorderWidth: 2, pointHitRadius: 24,
    }] },
    options: {
      layout: { padding: { top: 8, right: 8 } },
      interaction: { mode: 'index', intersect: false },
      scales: {
        y: { min: 0, max: 100, grid: { color: GRADE }, border: { display: false }, ticks: { stepSize: 25, callback: v => v + '%' } },
        x: { grid: { display: false }, border: { color: GRADE }, ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 8 } },
      },

const Cal = (() => {

function chip(a) {

}

function desenhar() {
  const filtro = $('#filtro').value;
  const colabs = cal.colaboradores.filter(c => !filtro || c.equipe_id === filtro).sort((a, b) => a.nome.localeCompare(b.nome));

      ${s.dias.map(d => {

      }).join('')}</tr>`).join('')}
    </table></section>`).join('');
  ligar();
}

function ligar() {
  document.querySelectorAll('.add').forEach(b => b.onclick = () => editar({ data: b.dataset.d, colaborador_id: b.dataset.c }));
  document.querySelectorAll('.chip').forEach(c => {
    c.onclick = () => editar(cal.atividades.find(a => a.id === c.dataset.id));
    c.ondragstart = e => { e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed = 'copyMove'; };
  });
  document.querySelectorAll('td[data-d]').forEach(td => {
    td.ondragover = e => { e.preventDefault(); td.classList.add('sobre'); };
    td.ondragleave = () => td.classList.remove('sobre');
    td.ondrop = async e => {
      e.preventDefault(); td.classList.remove('sobre');
      const id = e.dataTransfer.getData('text/plain'); if (!id) return;
      const a = cal.atividades.find(x => x.id === id); if (!a) return;
      if (a.data === td.dataset.d && a.colaborador_id === td.dataset.c) return;
      const copiar = e.ctrlKey || e.altKey; // Ctrl/Alt + arrastar = duplicar
      const nova = { id, data: td.dataset.d, colaborador_id: td.dataset.c };
      if (!copiar) { a.data = nova.data; a.colaborador_id = nova.colaborador_id; desenhar(); } // mostra na hora; o servidor confirma em seguida
      try {
        await rpc(copiar ? 'gestao.atividade.duplicar' : 'gestao.atividade.salvar', nova);
        if (copiar) { toast('Atividade duplicada'); carregar(); } else toast('Atividade remanejada');
      } catch (err) { toast(err.message, true); carregar(); }

}

function editar(a) {

  const opts = ['<option value="">Não alocada</option>', ...cal.colaboradores.map(c => `<option value="${c.id}" ${c.id === a.colaborador_id ? 'selected' : ''}>${esc(c.nome)}</option>`)].join('');
  const o = modal(`<h2>${nova ? 'Nova atividade' : 'Editar atividade'}</h2>

    <div class="acoes">${nova ? '' : '<button class="perigo" id="f-del">Excluir</button><button id="f-dup">Duplicar</button>'}<button id="f-x">Cancelar</button><button class="pri" id="f-ok">Salvar</button></div>`);
  const dados = () => ({ os: $('#f-os').value, descricao: $('#f-desc').value, data: $('#f-data').value, colaborador_id: $('#f-col').value });
  const rodar = async (fn, msg) => { try { await fn(); o.fechar(); toast(msg); carregar(); } catch (e) { toast(e.message, true); } };
  $('#f-x').onclick = o.fechar;
  $('#f-ok').onclick = () => rodar(() => rpc('gestao.atividade.salvar', nova ? dados() : { id: a.id, ...dados() }), 'Salvo');
  if (!nova) {
    $('#f-dup').onclick = () => rodar(() => rpc('gestao.atividade.duplicar', { id: a.id, ...dados() }), 'Atividade duplicada');
    $('#f-del').onclick = () => { if (confirm('Excluir esta atividade da programação?')) rodar(() => rpc('gestao.atividade.excluir', { id: a.id }), 'Excluída'); };
  }
  $('#f-desc').focus();
}

const HTML_ADM = aba => '<header class="top">' + marca + '<h1>ADM · Informe de Turno</h1><nav>' +
  ADM_ABAS.map(([k, n]) => '<a href="#" data-aba="' + k + '" class="' + (k === aba ? 'on' : '') + '">' + n + '</a>').join('') +
  '<a href="#" data-ir="inicio">Início</a></nav><button id="sair" class="peq">Sair</button></header><main id="admMain"></main><footer class="assinatura">Desenvolvido por <b>Airton C. M. Augusto</b></footer>';
const SKEL = {
  aderencia: `
    <div class="card no-print"><div class="linha">
      <div><label>De</label><input type="date" id="de"></div>
      <div><label>Até</label><input type="date" id="ate"></div>
      <div><label>Equipe</label><select id="equipe"><option value="">Todas</option></select></div>
      <div class="fixo"><button class="pri" id="aplicar">Atualizar</button></div>
      <div class="fixo"><button id="p7">7 dias</button> <button id="p30">30 dias</button></div>
    </div></div>

    <div class="kpis" id="kpis"></div>
    <div class="grid2">
      <div class="card"><h2>Aderência por equipe</h2><p class="sub">% das atividades planejadas no período, ordenado da maior para a menor aderência</p><div class="graf" id="wEquipe"><canvas id="gEquipe"></canvas></div></div>
      <div class="card"><h2>Evolução diária da aderência</h2><p class="sub">% de atividades concluídas em relação às planejadas de cada dia</p><div class="graf" id="wDia" style="height:280px"><canvas id="gDia"></canvas></div></div>
    </div>
    <div class="card"><h2>Aderência por colaborador</h2><p class="sub">% das atividades planejadas no período · o número à direita é a aderência (concluídas)</p><div class="graf" id="wColab"><canvas id="gColab"></canvas></div></div>
    <div class="card" style="overflow-x:auto"><h2>Detalhamento em tabela</h2><p class="sub">Os mesmos dados dos gráficos, com os números absolutos</p><table id="tab"></table></div>

    <div class="card"><h2>Relatório de turno por equipe</h2>
      <div class="linha no-print"><div><label>Data</label><input type="date" id="rdata"></div><div class="fixo"><button id="rbtn">Ver</button> <button id="rimp">Imprimir</button></div></div>
      <div id="rel"></div>
    </div>
  `,
  programacao: `
    <div class="nav-sem">
      <button id="ant">◀ Anterior</button><button id="hoje">Semana atual</button><button id="prox">Próxima ▶</button>
      <select id="filtro" style="width:auto"><option value="">Todas as equipes</option></select>
      <span class="mut">Arraste as atividades entre células para remanejar · clique para editar · “+” para adicionar.</span>
    </div>
    <div id="semanas"></div>
  `,
  cadastros: `
    <div class="card"><h2>Equipes</h2>
      <form id="fe" class="linha"><div><input id="eq-nome" placeholder="Nome da equipe (ex.: Mecânica - Turno A)" required></div><div class="fixo"><button class="pri">Adicionar</button></div></form>
      <table id="te"></table></div>
    <div class="card"><h2>Colaboradores</h2>
      <form id="fc" class="linha"><div><input id="co-nome" placeholder="Nome do colaborador" required></div><div><select id="co-eq"></select></div><div class="fixo"><button class="pri">Adicionar</button></div></form>
      <table id="tc"></table></div>
  `,
};

const app = $('#app');
let abaAtual = 'aderencia';

function ir(v) {
  Dash.unmount();
  document.querySelectorAll('.overlay').forEach(o => o.remove());
  window.scrollTo(0, 0);
  if (v === 'inicio') { app.innerHTML = HTML_INICIO; if (NO_GOOGLE) { const l = $('#lk-cartaz'); if (l) l.remove(); } }
  else if (v === 'operacional') { app.innerHTML = HTML_OP; Op.mount(); }
  else if (v === 'adm') { entrarAdm(); }
}

function entrarAdm() {
  app.innerHTML = HTML_ADM(abaAtual);
  if (!Tok.get()) return pedirLogin(); // se a sessão tiver vencido, o servidor avisa e o login reaparece
  montarAba(abaAtual);
}

function montarAba(aba) {
  abaAtual = aba;
  Dash.unmount();
  document.querySelectorAll('[data-aba]').forEach(a => a.classList.toggle('on', a.dataset.aba === aba));
  $('#admMain').innerHTML = SKEL[aba];
  ({ aderencia: Dash, programacao: Cal, cadastros: Cad })[aba].mount();
}

function pedirLogin() {
  if ($('#login-ov')) return;
  const o = modal('<h2>Acesso restrito — ADM</h2><form id="lf"><label>Senha</label><input type="password" id="senha" autocomplete="current-password" autofocus><p class="mut" id="lerro" style="color:var(--vermelho)"></p><div class="acoes"><button type="button" id="lv">Voltar ao início</button><button class="pri">Entrar</button></div></form>');
  o.id = 'login-ov';
  $('#lv').onclick = () => ir('inicio');
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    try { const r = await rpc('auth.login', { senha: $('#senha').value }); Tok.set(r.token); o.remove(); montarAba(abaAtual); }
    catch (err) { $('#lerro').textContent = err.message; }
  };
}

document.addEventListener('click', e => {
  const a = e.target.closest('[data-ir],[data-aba]');
  if (a) { e.preventDefault(); a.dataset.ir ? ir(a.dataset.ir) : montarAba(a.dataset.aba); }
  if (e.target.id === 'sair') { Tok.clear(); ir('inicio'); }
});

// Aplicativo instalável (só na versão hospedada fora do Google): ícone na tela inicial e abertura rápida.
if (!NO_GOOGLE) {
  [['manifest', 'manifest.json'], ['apple-touch-icon', 'icon-192.png']].forEach(([rel, href]) => { const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l); });
  const m = document.createElement('meta'); m.name = 'theme-color'; m.content = '#0a0a0a'; document.head.appendChild(m);
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
}

prefetchInicio();
ir('inicio');
</script>
</body>
</html>
