<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR code — Informe de Turno</title>
<style>
  :root { --gold: #c4902e; --pri: #0a0a0a; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f5f2; color: #1b1b1b; }
  .folha { max-width: 820px; margin: 0 auto; background: #fff; min-height: 100vh; display: flex; flex-direction: column; }
  .topo { background: radial-gradient(ellipse at 50% 0%, #2a2112 0%, #0a0a0a 65%); color: #fff; text-align: center; padding: 28px 16px 36px; border-bottom: 4px solid var(--gold); }
  .topo img { width: 220px; max-width: 60%; }
  .topo h1 { margin: 10px 0 0; font-weight: 300; letter-spacing: 4px; text-transform: uppercase; font-size: 1.9rem; }
  .corpo { flex: 1; text-align: center; padding: 28px 20px; }
  .corpo p.chamada { font-size: 1.35rem; font-weight: 600; margin: 0 0 18px; }
  #qr svg { width: min(78vw, 420px); height: auto; border: 3px solid var(--pri); border-radius: 12px; padding: 14px; }
  .url { margin-top: 18px; font-size: 1.15rem; font-weight: 600; word-break: break-all; color: var(--pri); }
  .passos { text-align: left; max-width: 520px; margin: 24px auto 0; color: #444; }
  .passos li { margin: 6px 0; }
  .acoes { padding: 14px; text-align: center; }
  .assinatura { text-align: center; font-size: .8rem; color: #6a665e; padding: 14px 12px 20px; border-top: 3px solid var(--gold); }
  .assinatura b { color: #8a6114; }
  button { font: inherit; padding: 10px 22px; border-radius: 8px; border: 1px solid var(--pri); background: var(--pri); color: #fff; cursor: pointer; font-weight: 600; }
  @media print { body { background: #fff; } .acoes { display: none; } .folha { min-height: auto; } }
</style>
</head>
<body>
<div class="folha">
  <div class="topo"><img id="logo" alt="AngloGold Ashanti"><h1>Informe de Turno</h1></div>
  <div class="corpo">
    <p class="chamada">Aponte a câmera do celular para o código</p>
    <div id="qr" aria-label="QR code do endereço do Informe de Turno"></div>
    <div class="url" id="url"></div>
    <ol class="passos">
      <li>Abra o endereço e escolha <b>OPERACIONAL</b>.</li>
      <li>Selecione o seu nome e informe o turno.</li>
      <li>Dica: no menu do navegador, escolha <b>“Adicionar à tela inicial”</b> para abrir como aplicativo.</li>
    </ol>
  </div>
  <div class="acoes"><button onclick="window.print()">Imprimir esta página</button></div>
  <footer class="assinatura">Desenvolvido por <b>Airton C. M. Augusto</b></footer>
</div>
<script src="vendor/qrcode.js"></script>
<script>
  // O endereço é calculado a partir de onde esta página está hospedada: o QR sempre aponta para o site certo.
  const base = location.href.replace(/cartaz\.html.*$/, '').replace(/[?#].*$/, '');
  const qr = qrcode(0, 'M'); qr.addData(base); qr.make();
  document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
  document.getElementById('url').textContent = base.replace(/^https?:\/\//, '').replace(/\/$/, '');
  document.getElementById('logo').src = 'logo.png';
</script>
</body>
</html>
